    <section class="faq card" id="faq">
      <div class="section-head">
        <div>
          <span class="kicker">FAQ</span>
          <h2 data-zh="常见问题" data-en="Frequently Asked Questions">常见问题</h2>
          <p data-zh="这里集中回答社区最常见的购买、持有和治理问题。" data-en="This section answers the most common community questions about trading, holding, and governance.">这里集中回答社区最常见的购买、持有和治理问题。</p>
        </div>
      </div>

      <div class="faq-list">
        <button class="faq-item active" type="button">
          <div class="faq-question">
            <strong data-zh="别人现在能买 PU 吗？" data-en="Can people buy PU right now?">别人现在能买 PU 吗？</strong>
            <span data-zh="点击展开" data-en="Click to expand">点击展开</span>
          </div>
          <div class="faq-answer" data-zh="只有当你创建公开流动性池后，别人才能通过 DEX 正常买卖 PU。" data-en="Only after you create a public liquidity pool can others buy and sell PU on DEXs.">只有当你创建公开流动性池后，别人才能通过 DEX 正常买卖 PU。</div>
        </button>

        <button class="faq-item" type="button">
          <div class="faq-question">
            <strong data-zh="我需要自己买回一部分 PU 吗？" data-en="Do I need to buy back some PU myself?">我需要自己买回一部分 PU 吗？</strong>
            <span data-zh="点击展开" data-en="Click to expand">点击展开</span>
          </div>
          <div class="faq-answer" data-zh="不一定。若初始供应已经在你的控制地址，你本身已持有发行份额。" data-en="Not necessarily. If initial supply is already in your controlled wallet, you already hold the issuance allocation.">不一定。若初始供应已经在你的控制地址，你本身已持有发行份额。</div>
        </button>

        <button class="faq-item" type="button">
          <div class="faq-question">
            <strong data-zh="PU 是稳定币吗？" data-en="Is PU a stablecoin?">PU 是稳定币吗？</strong>
            <span data-zh="点击展开" data-en="Click to expand">点击展开</span>
          </div>
          <div class="faq-answer" data-zh="不是。PU 属于可交易代币，价格由市场流动性和交易行为决定。" data-en="No. PU is a tradable token whose price is determined by liquidity and market activity.">不是。PU 属于可交易代币，价格由市场流动性和交易行为决定。</div>
        </button>
      </div>
